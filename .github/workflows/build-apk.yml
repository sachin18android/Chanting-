name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Extract Android project
        run: |
          unzip -q OmPitchTrainer-Android-MVP.zip -d extracted
          echo "Extracted project:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Android project
        id: project
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmPitchTrainer-debug-apk
          path: ${{ steps.project.outputs.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
